<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TattooInk - Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Logotipo/Título Principal no Topo -->
  <header class="header-brand">
    <h1 class="main-logo">Tattoo<span>Ink</span></h1>
    <p class="tagline">Tattoo & Piercing Studio</p>
  </header>

  <!-- Container de Login e Cadastro -->
  <div class="container" id="container">
    
    <!-- Formulário de Cadastro -->
    <div class="form-container sign-up">
      <form>
        <h2>Criar Conta</h2>
        <input type="text" placeholder="Nome Completo" required />
        <input type="email" placeholder="E-mail" required />
        <input type="password" placeholder="Senha" required />
        <button type="submit">Cadastrar</button>
      </form>
    </div>

    <!-- Formulário de Login -->
    <div class="form-container sign-in">
      <form>
        <h2>Entrar</h2>
        <input type="email" placeholder="E-mail" required />
        <input type="password" placeholder="Senha" required />
        <a href="#">Esqueceu a senha?</a>
        <button type="submit">Entrar</button>
      </form>
    </div>

    <!-- Painel de Transição (Desktop) -->
    <div class="toggle-container">
      <div class="toggle">
        <div class="toggle-panel toggle-left">
          <h2>Já é cliente?</h2>
          <p>Faça login para gerenciar seus agendamentos e ver suas artes.</p>
          <button class="hidden" id="login">Entrar</button>
        </div>
        <div class="toggle-panel toggle-right">
          <h2>Primeira vez?</h2>
          <p>Cadastre-se na TattooInk para agendar sua próxima sessão.</p>
          <button class="hidden" id="register">Cadastrar-se</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>

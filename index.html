<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TattooInk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <!-- Logotipo/Título Principal no Topo -->
  <header class="header-brand">
    <h1 class="main-logo">Tattoo<span>Ink</span></h1>
    <p class="tagline">Tattoo Studio</p>
  </header>

  <!-- Container de Login e Cadastro -->
    <div class="container" id="container">

        <!--Formulario Cadastro-->

        <div class="form-container sign-ip">
            <form>
                <h1>Criar Conta</h1>

                <input type="text" placeholder="Nome Completo" required />

                <input type="email" placeholder="E-mail" required />

                <input type="password" placeholder="Senha" required />

                <button type="submit">Cadastrar</button>
            </form>
        </div>
        
        <!--Formulario Login-->

        <div class="form-container sign-in">
            <form>
                <h1>Entrar</h1>

                <input type="email" placeholder="E-mail" required />

                <input type="password" placeholder="Senha" required />

                <a href="#">Esqueceu a senha?</a>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <!-- Painel de Transicao/Alternancia -->

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Já tem uma conta?</h1>
                    <p>Faça login para acessar todas as fucionalidades do site.</p>
                    <button class="hidden" id="login">Entrar</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Bem-vindo à TattooInk</h1>
                    <p>Cadastre-se para agendar sua próxima arte e conhecer alguns trabalhos.</p>
                    <button class="hidden" id="register">Cadastrar-se</button>
                </div>
            </div>
        </div>

    </div>



    




    <script src="script.js"></script>
</body>
</html>
